name: TEMP W05-07 Frozen Remediation Check
on:
  push:
    branches: [sol/t11-w05-07-wave-closure-20261008]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/renderer/app/AppShell.tsx src/renderer/app/TemplateBrowser.tsx src/renderer/app/template-browser.css src/renderer/state/project-session/use-project-session.ts src/main/verification/w11-05-ui-capture.ts src/renderer/app/visual-layer-controls.css tests/component/AppShell.visual-layer-editor.test.tsx
      - name: Commit formatted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize W05-07 frozen remediation"
            git push
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:component
      - run: npm run test:integration
