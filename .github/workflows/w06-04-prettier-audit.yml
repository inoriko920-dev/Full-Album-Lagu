name: W06-04 temporary Prettier audit
on:
  pull_request:
    paths:
      - "src/renderer/playback/live-spectrum-runtime.ts"
      - "tests/unit/live-spectrum-runtime.test.ts"
      - ".github/workflows/w06-04-prettier-audit.yml"
permissions:
  contents: read
jobs:
  print-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Print exact formatter changes without pushing
        run: |
          npx prettier --write src/renderer/playback/live-spectrum-runtime.ts tests/unit/live-spectrum-runtime.test.ts
          git diff -- src/renderer/playback/live-spectrum-runtime.ts tests/unit/live-spectrum-runtime.test.ts
