name: TEMP W05-05 Prettier Repair
on:
  push:
    branches: [sol/t11-w05-05-layer-inspector-ui-20261008]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/renderer/app/visual-layer-defaults.ts src/renderer/app/VisualLayerControls.tsx src/renderer/app/visual-layer-controls.css src/renderer/app/AppShell.tsx src/renderer/state/project-session/use-project-session.ts src/core/application/services/project-layer-commands.ts tests/component/AppShell.visual-layer-editor.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: format T11-W05-05 Layer/Inspector UI"
            git push
          fi
