name: Verify S08-T02 Clean Lockfile

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap-s08-t02-verify/trigger.txt"

permissions:
  contents: write

jobs:
  verify-clean-lock:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Clean reproducible install
        run: npm ci

      - name: Full foundation verification
        run: npm run verify

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Record and commit verification evidence
        shell: pwsh
        run: |
          @"
          # S08-T02 Clean Lockfile Verification

          - GitHub Actions run: $env:GITHUB_RUN_ID
          - Source SHA: $env:GITHUB_SHA
          - Platform: windows-latest
          - Node: $(node --version)
          - npm: $(npm --version)
          - npm ci: PASS
          - npm run verify: PASS
          - npm audit --omit=dev --audit-level=high: PASS
          - Product feature implementation: NOT STARTED
          "@ | Set-Content -Encoding utf8 docs/architecture/S08_T02_LOCKFILE_VERIFICATION.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .bootstrap-s08-t02-verify
          git rm .github/workflows/verify-s08-t02-lock.yml
          git add docs/architecture/S08_T02_LOCKFILE_VERIFICATION.md
          git commit -m "chore: verify clean S08-T02 lockfile baseline"
          git push
