name: Temporary W11-03-06 Prettier

on:
  push:
    branches:
      - sol/t11-w03-06-wave-closure

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[prettier-w03-06]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/t11-w03-06-wave-closure
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format T11-W03-06 files
        run: npx prettier --write src/main/bootstrap.ts scripts/run-w11-album-timeline-history-closure.mjs package.json
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/main/bootstrap.ts scripts/run-w11-album-timeline-history-closure.mjs package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/bootstrap.ts scripts/run-w11-album-timeline-history-closure.mjs package.json
          git commit -m "chore: format T11-W03-06 [prettier-w03-06]"
          git push origin HEAD:sol/t11-w03-06-wave-closure
