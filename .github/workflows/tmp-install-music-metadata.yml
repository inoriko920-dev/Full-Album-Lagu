name: Temporary Install music-metadata

on:
  push:
    branches:
      - sol/t11-w02-03-audio-probe-metadata
    paths:
      - .github/workflows/tmp-install-music-metadata.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/t11-w02-03-audio-probe-metadata
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install exact dependency and commit lockfile
        shell: bash
        run: |
          npm install --save-exact music-metadata@12.0.0
          npm ls music-metadata
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add music-metadata 12.0.0"
          git push origin HEAD:sol/t11-w02-03-audio-probe-metadata
