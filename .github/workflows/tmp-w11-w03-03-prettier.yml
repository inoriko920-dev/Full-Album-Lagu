name: Temporary W11-03-03 Prettier

on:
  push:
    branches:
      - sol/t11-w03-03-track-application-core

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[prettier-w03-03]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/t11-w03-03-track-application-core
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format T11-W03-03 files
        run: npx prettier --write src/core/application/services/project-track-commands.ts tests/unit/project-track-commands.test.ts tests/integration/project-track-command-persistence.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/core/application/services/project-track-commands.ts tests/unit/project-track-commands.test.ts tests/integration/project-track-command-persistence.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/application/services/project-track-commands.ts tests/unit/project-track-commands.test.ts tests/integration/project-track-command-persistence.test.ts
          git commit -m "chore: format T11-W03-03 [prettier-w03-03]"
          git push origin HEAD:sol/t11-w03-03-track-application-core
