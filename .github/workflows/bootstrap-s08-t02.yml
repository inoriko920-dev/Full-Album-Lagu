name: Bootstrap S08-T02 Foundation

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap-s08-t02/trigger.txt"

permissions:
  contents: write

jobs:
  foundation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve exact foundation dependencies
        shell: pwsh
        run: |
          npm install --save-exact react@latest react-dom@latest zod@latest
          npm install --save-dev --save-exact electron@43.6.0 vite@latest @vitejs/plugin-react@latest typescript@latest esbuild@latest vitest@latest @testing-library/react@latest @testing-library/jest-dom@latest jsdom@latest @types/node@latest @types/react@latest @types/react-dom@latest eslint@latest @eslint/js@latest typescript-eslint@latest eslint-plugin-react-hooks@latest globals@latest prettier@latest electron-builder@latest

      - name: Format foundation source
        run: npm run format

      - name: Record exact foundation baseline
        run: node scripts/write-foundation-baseline.mjs

      - name: Verify foundation
        run: npm run verify

      - name: Show installed top-level baseline
        run: npm ls --depth=0

      - name: Commit verified foundation baseline
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .bootstrap-s08-t02
          git rm .github/workflows/bootstrap-s08-t02.yml
          git add -A
          git commit -m "chore: establish verified Electron TypeScript foundation"
          git push
