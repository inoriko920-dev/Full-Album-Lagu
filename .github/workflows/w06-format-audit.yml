name: W06 temporary formatting diff (read only)
on:
  pull_request:
    paths:
      - "src/main/infrastructure/media/node-preview-audio-lease-store.ts"
      - "tests/unit/node-preview-audio-lease-store.test.ts"
      - ".github/workflows/w06-format-audit.yml"
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Show exact Prettier diff (no push)
        shell: bash
        run: |
          npx prettier --write src/main/infrastructure/media/node-preview-audio-lease-store.ts tests/unit/node-preview-audio-lease-store.test.ts
          git diff -- src/main/infrastructure/media/node-preview-audio-lease-store.ts tests/unit/node-preview-audio-lease-store.test.ts
