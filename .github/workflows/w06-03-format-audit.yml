name: W06-03 transport formatting audit
on:
  pull_request:
    paths:
      - "src/core/application/services/album-playback-transport.ts"
      - "tests/unit/album-playback-transport.test.ts"
      - ".github/workflows/w06-03-format-audit.yml"
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff (no push)
        run: |
          npx prettier --write src/core/application/services/album-playback-transport.ts tests/unit/album-playback-transport.test.ts
          git diff -- src/core/application/services/album-playback-transport.ts tests/unit/album-playback-transport.test.ts
