name: Assemble W11-02 Planning DOCX

on:
  push:
    branches: [astra/w11-02-media-intake-planning]
    paths:
      - ".tmp/w11-02-docx/**"
      - ".github/workflows/assemble-w11-02-docx.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[docx-assembled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: astra/w11-02-media-intake-planning
          fetch-depth: 0
      - name: Assemble and verify DOCX
        shell: bash
        run: |
          set -euo pipefail
          out="docs/source-of-truth/planning/current/11_STEP_11_W11_02_MEDIA_INTAKE_FOUNDATION_CHARTER_LAGU_FULL_ALBUM_v1_0.docx"
          cat .tmp/w11-02-docx/chunk*.b64 | tr -d '\r\n' | base64 -d > "$out"
          actual="$(sha256sum "$out" | awk '{print $1}')"
          expected="d67ff4aa5397739442d99804b12d82bdb0c87f8e8b260c616e3418ab2b3bed04"
          test "$actual" = "$expected"
          python - <<'PY'
          from zipfile import ZipFile
          p="docs/source-of-truth/planning/current/11_STEP_11_W11_02_MEDIA_INTAKE_FOUNDATION_CHARTER_LAGU_FULL_ALBUM_v1_0.docx"
          with ZipFile(p) as z:
              bad=z.testzip()
              assert bad is None, bad
              assert "word/document.xml" in z.namelist()
          print("DOCX ZIP integrity: PASS")
          PY
      - name: Commit source-of-truth DOCX and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source-of-truth/planning/current/11_STEP_11_W11_02_MEDIA_INTAKE_FOUNDATION_CHARTER_LAGU_FULL_ALBUM_v1_0.docx
          git rm -r .tmp/w11-02-docx
          git rm .github/workflows/assemble-w11-02-docx.yml
          git commit -m "ASTRA: add verified W11-02 planning DOCX [docx-assembled]"
          git push origin HEAD:astra/w11-02-media-intake-planning
