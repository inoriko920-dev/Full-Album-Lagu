name: TEMP W05-03 Prettier Repair
on:
  push:
    branches:
      - sol/t11-w05-03-template-core-20261008
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/core/domain/template-document.ts src/main/infrastructure/persistence/json-template-store.ts tests/unit/template-workflow.test.ts tests/integration/json-template-store.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/domain/template-document.ts src/main/infrastructure/persistence/json-template-store.ts tests/unit/template-workflow.test.ts tests/integration/json-template-store.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format T11-W05-03 source and tests"
            git push
          fi
