name: R23 Temporary Prettier CSS Export
on:
  push:
    branches:
      - sol/t11-w05-07-wave-closure-20261008
jobs:
  export-prettier-css:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx prettier --write src/renderer/app/template-browser.css
      - uses: actions/upload-artifact@v4
        with:
          name: r23-prettier-css-formatted
          path: src/renderer/app/template-browser.css
          if-no-files-found: error
