name: TEMP W05-07 R03 SVG Lint
on:
  push:
    branches: [sol/t11-w05-07-wave-closure-20261008]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/renderer/visual/TemplateArtwork.tsx src/renderer/visual/StaticScenePreview.tsx src/renderer/visual/static-scene-preview.css src/renderer/app/TemplateBrowser.tsx src/renderer/app/template-browser.css
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize W05-07 R03 local illustration assets"
            git push
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:component
      - run: npm run test:integration
