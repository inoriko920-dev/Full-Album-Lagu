name: Repository Recovery Backup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-recovery-backup.yml"
      - "scripts/repository-recovery-backup.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-recovery-backup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build and verify repository recovery backup
        shell: pwsh
        run: ./scripts/repository-recovery-backup.ps1

      - name: Upload repository recovery backup
        uses: actions/upload-artifact@v4
        with:
          name: Full-Album-Lagu-Repository-Recovery-Backup
          path: |
            Full-Album-Lagu-Repository-Backup-*.zip
            Full-Album-Lagu-Repository-Backup-METADATA.txt
          if-no-files-found: error
          retention-days: 90
