name: W06-05 live editor Prettier diff
on:
  pull_request:
    paths:
      - "src/renderer/app/AppShell.tsx"
      - "src/renderer/state/use-album-preview-playback.ts"
      - "src/renderer/visual/StaticScenePreview.tsx"
      - ".github/workflows/w06-05-live-format-diff.yml"
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff without push
        run: |
          npx prettier --write src/renderer/app/AppShell.tsx src/renderer/state/use-album-preview-playback.ts src/renderer/visual/StaticScenePreview.tsx
          git diff -- src/renderer/app/AppShell.tsx src/renderer/state/use-album-preview-playback.ts src/renderer/visual/StaticScenePreview.tsx
