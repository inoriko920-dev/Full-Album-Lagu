name: W06-03 audio adapter exact formatting audit
on:
  pull_request:
    paths:
      - "src/renderer/playback/html-media-playback-driver.ts"
      - "tests/unit/html-media-playback-driver.test.ts"
      - ".github/workflows/w06-03-audio-format-audit.yml"
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Print exact project formatter diff without push
        run: |
          npx prettier --write src/renderer/playback/html-media-playback-driver.ts tests/unit/html-media-playback-driver.test.ts
          git diff -- src/renderer/playback/html-media-playback-driver.ts tests/unit/html-media-playback-driver.test.ts
