name: W06-03 relink formatting audit (temporary)
on:
  pull_request:
    paths:
      - "src/main/infrastructure/media/preview-audio-access-service.ts"
      - "tests/unit/preview-audio-access-service.test.ts"
      - ".github/workflows/w06-03-relink-format-audit.yml"
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff without push
        run: |
          npx prettier --write src/main/infrastructure/media/preview-audio-access-service.ts tests/unit/preview-audio-access-service.test.ts
          git diff -- src/main/infrastructure/media/preview-audio-access-service.ts tests/unit/preview-audio-access-service.test.ts
