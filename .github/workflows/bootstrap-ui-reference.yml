name: Bootstrap UI Reference

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap-ui-ref/part-06.txt'

permissions:
  contents: write

jobs:
  reconstruct-ui-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct visual UI reference DOCX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/source-of-truth/ui
          cat .bootstrap-ui-ref/part-*.txt | base64 -d > docs/source-of-truth/ui/06_STEP_04_FINAL_UI_REFERENCE_LAGU_FULL_ALBUM_v1_1_REPO_VISUAL_MICRO.docx
          test -s docs/source-of-truth/ui/06_STEP_04_FINAL_UI_REFERENCE_LAGU_FULL_ALBUM_v1_1_REPO_VISUAL_MICRO.docx
          unzip -t docs/source-of-truth/ui/06_STEP_04_FINAL_UI_REFERENCE_LAGU_FULL_ALBUM_v1_1_REPO_VISUAL_MICRO.docx
      - name: Commit reconstructed source-of-truth and remove bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .bootstrap-ui-ref
          git rm .github/workflows/bootstrap-ui-reference.yml
          git add docs/source-of-truth/ui/06_STEP_04_FINAL_UI_REFERENCE_LAGU_FULL_ALBUM_v1_1_REPO_VISUAL_MICRO.docx
          git commit -m "docs: add visual UI reference source of truth"
          git push
