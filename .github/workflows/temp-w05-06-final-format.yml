name: TEMP W05-06 Final Formatting
on:
  push:
    branches: [sol/t11-w05-06-template-browser-20261008]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/renderer/state/project-session/use-project-session.ts src/renderer/app/TemplateBrowser.tsx tests/contract/template-ipc.test.ts
      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/state/project-session/use-project-session.ts src/renderer/app/TemplateBrowser.tsx tests/contract/template-ipc.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: finalize W05-06 template validation"
            git push
          fi
      - run: npm run typecheck
      - run: npm run test:contract
      - run: npm run test:component
