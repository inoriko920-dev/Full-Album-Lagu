name: W06-05 Multi-Batch Prettier Diff (Temporary)
on:
  pull_request:
    paths:
      - "src/renderer/state/project-session/use-project-session.ts"
      - "tests/unit/html-media-playback-driver.test.ts"
      - ".github/workflows/w06-05-multibatch-format-audit.yml"
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Display exact formatter delta without modifying repository
        run: |
          npx prettier --write src/renderer/state/project-session/use-project-session.ts tests/unit/html-media-playback-driver.test.ts
          git diff -- src/renderer/state/project-session/use-project-session.ts tests/unit/html-media-playback-driver.test.ts
