name: W06 packaged smoke formatter inspection
on:
  pull_request:
    paths:
      - "src/main/bootstrap.ts"
      - "scripts/run-w06-preview-protocol-smoke.mjs"
      - ".github/workflows/w06-packaged-format-audit.yml"
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write src/main/bootstrap.ts scripts/run-w06-preview-protocol-smoke.mjs
          git diff -- src/main/bootstrap.ts scripts/run-w06-preview-protocol-smoke.mjs
