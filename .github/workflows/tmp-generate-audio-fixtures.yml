name: Temporary Generate Synthetic Audio Fixtures

on:
  push:
    branches:
      - sol/t11-w02-03-audio-probe-metadata
    paths:
      - .github/workflows/tmp-generate-audio-fixtures.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/t11-w02-03-audio-probe-metadata
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          mkdir -p /tmp/lfa-audio-fixtures tests/fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=44100:cl=stereo -t 0.25 -c:a libmp3lame -b:a 64k \
            -metadata title="Tagged Track" -metadata artist="Fixture Artist" -metadata album="Fixture Album" -metadata track="7" -metadata date="2026" \
            -y /tmp/lfa-audio-fixtures/tagged.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=16000:cl=mono -t 0.25 -c:a pcm_s16le \
            -y /tmp/lfa-audio-fixtures/sample.wav
          ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=44100:cl=stereo -t 0.25 -c:a flac \
            -y /tmp/lfa-audio-fixtures/sample.flac
          ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=44100:cl=stereo -t 0.25 -c:a aac -b:a 64k \
            -y /tmp/lfa-audio-fixtures/sample.m4a
          ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=44100:cl=stereo -t 0.25 -c:a aac -b:a 64k -f adts \
            -y /tmp/lfa-audio-fixtures/sample.aac
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const specs = [
            ["mp3", "tagged.mp3"],
            ["wav", "sample.wav"],
            ["flac", "sample.flac"],
            ["m4a", "sample.m4a"],
            ["aac", "sample.aac"],
          ];
          const lines = [
            "// Synthetic audio fixtures generated from silence for tests only.",
            "// No third-party music/audio content is embedded.",
            "export const SYNTHETIC_AUDIO_FIXTURES = {",
          ];
          for (const [key, file] of specs) {
            const data = await readFile("/tmp/lfa-audio-fixtures/" + file);
            lines.push("  " + key + ': "' + data.toString("base64") + '",');
          }
          lines.push("} as const;", "");
          await writeFile("tests/fixtures/synthetic-audio-fixtures.ts", lines.join("\n"), "utf8");
          NODE
          npx prettier --write tests/fixtures/synthetic-audio-fixtures.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/synthetic-audio-fixtures.ts
          git commit -m "test: add synthetic audio probe fixtures"
          git push origin HEAD:sol/t11-w02-03-audio-probe-metadata
