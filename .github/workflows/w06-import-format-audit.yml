name: W06 import-source formatting audit
on:
  pull_request:
    paths:
      - "tests/unit/media-intake-service.test.ts"
      - ".github/workflows/w06-import-format-audit.yml"
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff without pushing
        run: |
          npx prettier --write tests/unit/media-intake-service.test.ts
          git diff -- tests/unit/media-intake-service.test.ts
