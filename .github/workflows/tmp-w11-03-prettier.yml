name: Temporary W11-03 Prettier

on:
  push:
    branches:
      - sol/t11-w03-01-command-engine

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[prettier-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/t11-w03-01-command-engine
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format W11-03 files
        run: npx prettier --write src/core/application/services/project-command-engine.ts src/core/domain/album-timeline.ts tests/unit/album-timeline.test.ts tests/unit/project-command-engine.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/core/application/services/project-command-engine.ts src/core/domain/album-timeline.ts tests/unit/album-timeline.test.ts tests/unit/project-command-engine.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/application/services/project-command-engine.ts src/core/domain/album-timeline.ts tests/unit/album-timeline.test.ts tests/unit/project-command-engine.test.ts
          git commit -m "chore: format W11-03 core [prettier-bot]"
          git push origin HEAD:sol/t11-w03-01-command-engine
