name: TEMP W05-07 Closure Tests
on:
  push:
    branches: [sol/t11-w05-07-wave-closure-20261008]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/renderer/app/TemplateBrowser.tsx src/renderer/app/template-browser.css tests/component/AppShell.visual-layer-editor.test.tsx tests/integration/w11-05-wave-closure.test.ts src/main/bootstrap.ts src/main/verification/w11-05-ui-capture.ts scripts/run-w11-visual-template-closure.mjs package.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize W05-07 closure and UI tests"
            git push
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:integration
      - run: npm run test:component
