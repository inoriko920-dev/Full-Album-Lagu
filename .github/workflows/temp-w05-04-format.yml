name: TEMP W05-04 Formatting
on:
  push:
    branches:
      - sol/t11-w05-04-static-preview-20261008
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/core/domain/static-scene-preview.ts src/renderer/state/ui-session/visual-selection-session.ts src/renderer/visual/StaticScenePreview.tsx src/renderer/visual/static-scene-preview.css tests/unit/static-scene-preview.test.ts tests/component/StaticScenePreview.test.tsx
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/domain/static-scene-preview.ts src/renderer/state/ui-session/visual-selection-session.ts src/renderer/visual/StaticScenePreview.tsx src/renderer/visual/static-scene-preview.css tests/unit/static-scene-preview.test.ts tests/component/StaticScenePreview.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format static scene preview implementation"
            git push
          fi
