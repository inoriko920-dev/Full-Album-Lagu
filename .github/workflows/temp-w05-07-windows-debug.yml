name: TEMP W05-07 Windows UI Debug
on:
  push:
    branches: [sol/t11-w05-07-wave-closure-20261008]
permissions:
  contents: read
jobs:
  electron-closure:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run e2e:w11:visual-template-closure
      - name: Upload W05 debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W05-07-Temp-Windows-Debug
          path: |
            artifacts/step11/T11-W05-07/evidence/**
            artifacts/step11/T11-W05-07/screenshots/**
          if-no-files-found: warn
