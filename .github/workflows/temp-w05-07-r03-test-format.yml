name: TEMP W05-07 R03 Test Formatting
on:
  push:
    branches: [sol/t11-w05-07-wave-closure-20261008]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write tests/component/StaticScenePreview.test.tsx tests/component/AppShell.visual-layer-editor.test.tsx
      - name: Commit formatted tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize W05-07 R03 visual regression tests"
            git push
          fi
      - run: npm run format:check
      - run: npm run test:component
