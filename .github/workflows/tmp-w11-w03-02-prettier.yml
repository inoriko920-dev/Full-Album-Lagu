name: Temporary W11-03-02 Prettier

on:
  push:
    branches:
      - sol/t11-w03-02-session-checkpoint

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[prettier-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/t11-w03-02-session-checkpoint
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format T11-W03-02 files
        run: npx prettier --write src/core/application/services/project-command-engine.ts src/core/application/services/project-session-history.ts src/renderer/state/project-session/use-project-session.ts tests/unit/project-session-history.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/core/application/services/project-command-engine.ts src/core/application/services/project-session-history.ts src/renderer/state/project-session/use-project-session.ts tests/unit/project-session-history.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/application/services/project-command-engine.ts src/core/application/services/project-session-history.ts src/renderer/state/project-session/use-project-session.ts tests/unit/project-session-history.test.ts
          git commit -m "chore: format T11-W03-02 [prettier-bot]"
          git push origin HEAD:sol/t11-w03-02-session-checkpoint
