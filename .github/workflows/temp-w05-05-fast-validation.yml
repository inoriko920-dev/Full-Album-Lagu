name: TEMP W05-05 Fast Validation
on:
  push:
    branches: [sol/t11-w05-05-layer-inspector-ui-20261008]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/renderer/app/AppShell.tsx tests/component/AppShell.visual-layer-editor.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/app/AppShell.tsx tests/component/AppShell.visual-layer-editor.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize W05-05 TypeScript patch"
            git push
          fi
      - run: npm run typecheck
      - run: npm run test:component
