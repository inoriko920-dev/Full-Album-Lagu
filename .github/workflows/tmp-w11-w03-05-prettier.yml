name: Temporary W11-03-05 Prettier

on:
  push:
    branches:
      - sol/t11-w03-05-history-hardening

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[prettier-w03-05]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/t11-w03-05-history-hardening
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format T11-W03-05 files
        run: npx prettier --write src/renderer/state/project-session/use-project-session.ts tests/component/AppShell.timeline-history.test.tsx tests/unit/project-history-hardening.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/renderer/state/project-session/use-project-session.ts tests/component/AppShell.timeline-history.test.tsx tests/unit/project-history-hardening.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/state/project-session/use-project-session.ts tests/component/AppShell.timeline-history.test.tsx tests/unit/project-history-hardening.test.ts
          git commit -m "chore: format T11-W03-05 [prettier-w03-05]"
          git push origin HEAD:sol/t11-w03-05-history-hardening
