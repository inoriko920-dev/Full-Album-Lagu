name: W06 T03 Prettier Diff (Temporary)
on:
  pull_request:
    paths:
      - 'src/renderer/main.tsx'
      - 'src/renderer/playback/w06-packaged-driver-proof.ts'
      - '.github/workflows/w06-03-driver-format-audit.yml'
jobs:
  exact-prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print exact T03 driver Prettier diff
        run: |
          npx prettier --write src/renderer/main.tsx src/renderer/playback/w06-packaged-driver-proof.ts
          git diff -- src/renderer/main.tsx src/renderer/playback/w06-packaged-driver-proof.ts
