name: Temporary Apply Prettier W02-04

on:
  push:
    branches:
      - sol/t11-w02-04-missing-relink-core
    paths:
      - .github/workflows/tmp-apply-prettier-w02-04.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/t11-w02-04-missing-relink-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact formatting
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write             src/core/application/services/media-relink-service.ts             src/core/application/services/missing-media-service.ts             src/core/contracts/media-relink.ts             src/main/composition-root.ts             src/main/ipc/register-ipc.ts             tests/integration/media-relink-core.test.ts             tests/unit/missing-media-service.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/core/application/services/media-relink-service.ts             src/core/application/services/missing-media-service.ts             src/core/contracts/media-relink.ts             src/main/composition-root.ts             src/main/ipc/register-ipc.ts             tests/integration/media-relink-core.test.ts             tests/unit/missing-media-service.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: format T11-W02-04 relink core"
          git push origin HEAD:sol/t11-w02-04-missing-relink-core
