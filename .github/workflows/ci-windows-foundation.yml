name: Windows Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Clean install
        run: npm ci

      - name: Foundation verification
        run: npm run verify

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Package Windows x64 directory
        run: npm run package:windows

      - name: Smoke packaged executable
        run: npm run smoke:packaged:windows

      - name: Build portable multi-file ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $zip = "artifacts/Lagu-Full-Album-0.0.0-foundation-windows-x64.zip"
          Compress-Archive -Path "out/win-unpacked/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = Get-FileHash $zip -Algorithm SHA256
          $checksumLine = "$($hash.Hash.ToLower())  $(Split-Path $zip -Leaf)"
          if ($checksumLine -notmatch '^[0-9a-f]{64}  .+\.zip

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-Windows-x64-Foundation
          path: |
            artifacts/Lagu-Full-Album-0.0.0-foundation-windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14) {
            throw "Invalid SHA256SUMS line: $checksumLine"
          }
          $checksumLine | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
          Get-Item $zip | Format-List FullName,Length
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-Windows-x64-Foundation
          path: |
            artifacts/Lagu-Full-Album-0.0.0-foundation-windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14