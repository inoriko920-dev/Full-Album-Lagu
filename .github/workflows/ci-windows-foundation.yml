name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      SLC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SLC_SOURCE_REF: ${{ github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Extract frozen UI-IMG-002A reference
        shell: pwsh
        run: |
          ./scripts/extract-ui-reference.ps1 `
            -DocxPath "docs/source-of-truth/ui/06_STEP_04_FINAL_UI_REFERENCE_LAGU_FULL_ALBUM_v1_1_REPO_COMPACT_SMALL.docx" `
            -ImageId "UI-IMG-002A" `
            -OutputPath "artifacts/ui/reference/UI-IMG-002A-reference.jpg"

      - name: Clean install
        run: npm ci

      - name: Foundation and UI verification
        run: npm run verify

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run STEP 10 SLC-010-001 save/reopen E2E
        run: npm run e2e:slc:save-reopen

      - name: Upload STEP 10 SLC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-S10-SLC-010-001-Evidence
          path: |
            artifacts/slc/SLC-010-001/**
          if-no-files-found: warn
          retention-days: 14

      - name: Run STEP 11 T11-W01-02 lifecycle E2E
        run: npm run e2e:w11:lifecycle

      - name: Upload STEP 11 T11-W01-02 lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-T11-W01-02-Lifecycle-Evidence
          path: |
            artifacts/step11/T11-W01-02/**
          if-no-files-found: warn
          retention-days: 14

      - name: Run STEP 11 T11-W01-03 recovery E2E
        run: npm run e2e:w11:recovery

      - name: Upload STEP 11 T11-W01-03 recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-T11-W01-03-Recovery-Evidence
          path: |
            artifacts/step11/T11-W01-03/**
          if-no-files-found: warn
          retention-days: 14

      - name: Run STEP 11 T11-W02-06 media intake closure E2E
        run: npm run e2e:w11:media-closure

      - name: Upload STEP 11 T11-W02-06 media closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-T11-W02-06-Media-Closure-Evidence
          path: |
            artifacts/step11/T11-W02-06/**
          if-no-files-found: warn
          retention-days: 14

      - name: Run STEP 11 T11-W03-06 album timeline history closure E2E
        run: npm run e2e:w11:timeline-history-closure

      - name: Upload STEP 11 T11-W03-06 wave closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-T11-W03-06-Wave-Closure-Evidence
          path: |
            artifacts/step11/T11-W03-06/**
          if-no-files-found: warn
          retention-days: 14

      - name: Run STEP 11 T11-W04-06 auto binding closure E2E
        run: npm run e2e:w11:auto-binding-closure

      - name: Upload STEP 11 T11-W04-06 wave closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-T11-W04-06-Wave-Closure-Evidence
          path: |
            artifacts/step11/T11-W04-06/**
          if-no-files-found: warn
          retention-days: 14

      - name: Run STEP 11 T11-W05-07 visual/template closure E2E
        run: npm run e2e:w11:visual-template-closure

      - name: Generate W11-05 frozen four-screen comparison evidence
        shell: pwsh
        run: |
          ./scripts/build-w05-frozen-visual-evidence.ps1

      - name: Upload STEP 11 T11-W05-07 wave closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-T11-W05-07-Visual-Template-Closure-Evidence
          path: |
            artifacts/step11/T11-W05-07/evidence/**
            artifacts/step11/T11-W05-07/screenshots/**
            artifacts/step11/T11-W05-07/references/**
            artifacts/step11/T11-W05-07/comparison/**
          if-no-files-found: error
          retention-days: 14

      - name: Capture SCR-002A real-app screenshot
        run: npm run ui:screenshot:scr002a

      - name: Verify UI screenshot evidence
        shell: pwsh
        run: |
          $shot = "artifacts/ui/SCR-002A.png"
          $dom = "artifacts/ui/SCR-002A-dom.json"
          if (!(Test-Path $shot)) {
            throw "UI screenshot missing: $shot"
          }
          if (!(Test-Path $dom)) {
            throw "UI DOM evidence missing: $dom"
          }

          $item = Get-Item $shot
          if ($item.Length -lt 2000) {
            throw "UI screenshot is unexpectedly small: $($item.Length) bytes"
          }

          $domEvidence = Get-Content $dom -Raw | ConvertFrom-Json
          if (
            $domEvidence.innerViewport.width -ne 1600 -or
            $domEvidence.innerViewport.height -ne 1000
          ) {
            throw "SCR-002A renderer viewport is $($domEvidence.innerViewport.width)x$($domEvidence.innerViewport.height), expected 1600x1000."
          }
          if (
            $domEvidence.shell.width -ne 1600 -or
            $domEvidence.shell.height -ne 1000
          ) {
            throw "SCR-002A app shell is $($domEvidence.shell.width)x$($domEvidence.shell.height), expected 1600x1000."
          }
          if (
            $domEvidence.capture.width -ne 1600 -or
            $domEvidence.capture.height -ne 1000
          ) {
            throw "SCR-002A PNG capture is $($domEvidence.capture.width)x$($domEvidence.capture.height), expected 1600x1000."
          }
          if (
            !$domEvidence.hasGeminiAgent -or
            !$domEvidence.hasPreviewEmpty -or
            !$domEvidence.hasTimelineEmpty
          ) {
            throw "SCR-002A required frozen regions were not present in the rendered DOM."
          }

          @(
            "Screen: SCR-002A",
            "Image ID: UI-IMG-002A",
            "Prompt ID: PROMPT-UI-SCR-002A",
            "Reference Pack: LFA-UI-REFERENCE-v1.1",
            "UI Freeze: LFA-UI-FREEZE-v1.0",
            "Implementation SHA: $env:GITHUB_SHA",
            "Viewport: 1600x1000 @ 100%",
            "PNG bytes: $($item.Length)",
            "DOM shell: $($domEvidence.shell.width)x$($domEvidence.shell.height)",
            "Capture: $($domEvidence.capture.width)x$($domEvidence.capture.height)"
          ) | Set-Content -Encoding utf8 artifacts/ui/SCR-002A-evidence.txt

          Get-Item $shot | Format-List FullName,Length
          Get-Content $dom
          Get-Content artifacts/ui/SCR-002A-evidence.txt

      - name: Verify frozen visual baseline
        shell: pwsh
        run: |
          ./scripts/build-ui-comparison.ps1 `
            -ReferencePath "artifacts/ui/reference/UI-IMG-002A-reference.jpg" `
            -ActualPath "artifacts/ui/SCR-002A.png" `
            -ManifestPath "docs/ui/manifests/UI_SCREEN_BASELINES.json" `
            -OutputDir "artifacts/ui/comparison" `
            -ScreenId "SCR-002A"

      - name: Upload S09-T03 visual baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-S09-T03-Visual-Baseline
          path: |
            artifacts/ui/reference/UI-IMG-002A-reference.jpg
            artifacts/ui/reference/UI-IMG-002A-reference.jpg.json
            artifacts/ui/SCR-002A.png
            artifacts/ui/SCR-002A-dom.json
            artifacts/ui/SCR-002A-evidence.txt
            artifacts/ui/comparison/SCR-002A-side-by-side.png
            artifacts/ui/comparison/SCR-002A-comparison.json
          if-no-files-found: warn
          retention-days: 14

      - name: Package Windows x64 directory
        run: npm run package:windows

      - name: Smoke packaged executable
        run: npm run smoke:packaged:windows

      - name: W11-06-02 real packaged MP3/WAV private protocol decoding
        run: node scripts/run-w06-preview-protocol-smoke.mjs

      - name: Upload W11-06-02 decoder and source-fingerprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-T11-W06-02-Audio-Decode-Evidence
          path: artifacts/step11/T11-W06-02/evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: W11-06-05 real packaged editor Play Pause Next Previous Mute and 128 tracks
        run: node scripts/run-w06-packaged-editor-controls.mjs

      - name: Upload W11-06-05 packaged editor UI and source-integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-T11-W06-05-Packaged-Editor-Evidence
          path: |
            artifacts/step11/T11-W06-05/evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: T11-W06-07 verify 20 AC evidence without waiving physical gates
        run: node scripts/run-w06-t07-acceptance-matrix.mjs

      - name: Upload W11-06-07 20-AC automated acceptance matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-T11-W06-07-20-AC-Matrix
          path: |
            artifacts/step11/T11-W06-07/evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Build portable multi-file ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $zip = "artifacts/Lagu-Full-Album-0.0.0-foundation-windows-x64.zip"
          Compress-Archive -Path "out/win-unpacked/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = Get-FileHash $zip -Algorithm SHA256
          $checksumLine = "$($hash.Hash.ToLower())  $(Split-Path $zip -Leaf)"
          if ($checksumLine -notmatch '^[0-9a-f]{64}  .+\.zip$') {
            throw "Invalid SHA256SUMS line: $checksumLine"
          }
          $checksumLine | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
          Get-Item $zip | Format-List FullName,Length
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-Windows-x64-Foundation
          path: |
            artifacts/Lagu-Full-Album-0.0.0-foundation-windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Verify and upload W11-06 ASTRA planning DOCX
        shell: pwsh
        run: |
          $docx = "docs/source-of-truth/planning/current/15_STEP_11_W11_06_PLAYBACK_SPECTRUM_CHARTER_LAGU_FULL_ALBUM_v1_0.docx"
          if (!(Test-Path $docx)) { throw "Missing mandatory W11-06 planning DOCX" }
          if ((Get-Item $docx).Length -lt 2000) { throw "W11-06 DOCX is unexpectedly small" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $docx))
          try {
            foreach ($name in @("[Content_Types].xml", "word/document.xml", "word/styles.xml")) {
              if ($null -eq $zip.GetEntry($name)) { throw "Malformed W11-06 DOCX: $name missing" }
            }
          } finally { $zip.Dispose() }
          Get-FileHash $docx -Algorithm SHA256 | Format-List

      - name: Upload W11-06 planning DOCX evidence
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-W11-06-Final-ASTRA-Planning-DOCX
          path: docs/source-of-truth/planning/current/15_STEP_11_W11_06_PLAYBACK_SPECTRUM_CHARTER_LAGU_FULL_ALBUM_v1_0.docx
          if-no-files-found: error
          retention-days: 14
