name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Clean install
        run: npm ci

      - name: Foundation and UI verification
        run: npm run verify

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Capture SCR-002A real-app screenshot
        run: npm run ui:screenshot:scr002a

      - name: Verify UI screenshot evidence
        shell: pwsh
        run: |
          $shot = "artifacts/ui/SCR-002A.png"
          if (!(Test-Path $shot)) {
            throw "UI screenshot missing: $shot"
          }
          $item = Get-Item $shot
          if ($item.Length -lt 50000) {
            throw "UI screenshot is unexpectedly small: $($item.Length) bytes"
          }
          @(
            "Screen: SCR-002A",
            "Image ID: UI-IMG-002A",
            "Prompt ID: PROMPT-UI-SCR-002A",
            "Reference Pack: LFA-UI-REFERENCE-v1.1",
            "UI Freeze: LFA-UI-FREEZE-v1.0",
            "Implementation SHA: $env:GITHUB_SHA",
            "Viewport: 1600x1000 @ 100%"
          ) | Set-Content -Encoding utf8 artifacts/ui/SCR-002A-evidence.txt
          Get-Item $shot | Format-List FullName,Length
          Get-Content artifacts/ui/SCR-002A-evidence.txt

      - name: Upload S09-T01 UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-S09-T01-UI-Evidence
          path: |
            artifacts/ui/SCR-002A.png
            artifacts/ui/SCR-002A-evidence.txt
          if-no-files-found: error
          retention-days: 14

      - name: Package Windows x64 directory
        run: npm run package:windows

      - name: Smoke packaged executable
        run: npm run smoke:packaged:windows

      - name: Build portable multi-file ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $zip = "artifacts/Lagu-Full-Album-0.0.0-foundation-windows-x64.zip"
          Compress-Archive -Path "out/win-unpacked/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = Get-FileHash $zip -Algorithm SHA256
          $checksumLine = "$($hash.Hash.ToLower())  $(Split-Path $zip -Leaf)"
          if ($checksumLine -notmatch '^[0-9a-f]{64}  .+\.zip$') {
            throw "Invalid SHA256SUMS line: $checksumLine"
          }
          $checksumLine | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
          Get-Item $zip | Format-List FullName,Length
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lagu-Full-Album-Windows-x64-Foundation
          path: |
            artifacts/Lagu-Full-Album-0.0.0-foundation-windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
