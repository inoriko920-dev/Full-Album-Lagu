name: Temporary Refresh AAC Fixture

on:
  push:
    branches:
      - sol/t11-w02-03-audio-probe-metadata
    paths:
      - .github/workflows/tmp-refresh-aac-fixture.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/t11-w02-03-audio-probe-metadata
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install fixture generator only
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Refresh synthetic AAC fixture
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error             -f lavfi -i anullsrc=r=44100:cl=stereo -t 2             -c:a aac -b:a 64k -f adts -y /tmp/sample.aac
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const fixturePath = "tests/fixtures/synthetic-audio-fixtures.ts";
          const source = await readFile(fixturePath, "utf8");
          const aac = (await readFile("/tmp/sample.aac")).toString("base64");
          const next = source.replace(/  aac: "[^"]*",/, '  aac: "' + aac + '",');
          if (next === source) throw new Error("AAC fixture replacement failed.");
          await writeFile(fixturePath, next, "utf8");
          NODE
          npx prettier --write tests/fixtures/synthetic-audio-fixtures.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/synthetic-audio-fixtures.ts
          git commit -m "test: lengthen synthetic AAC fixture"
          git push origin HEAD:sol/t11-w02-03-audio-probe-metadata
