name: Temporary T11-W01-03 Formatter

on:
  push:
    branches: [sol/t11-w01-03-autosave-recovery]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/t11-w01-03-autosave-recovery
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run format
      - name: Commit exact repository formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts package.json
          git commit -m "chore: apply repository Prettier [formatted]"
          git push origin HEAD:sol/t11-w01-03-autosave-recovery
