name: Temporary Format T11 W02 05

on:
  push:
    branches:
      - sol/t11-w02-05-frozen-media-ui
    paths:
      - .github/workflows/tmp-format-t11-w02-05.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/t11-w02-05-frozen-media-ui
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format task files and commit
        shell: bash
        run: |
          npx prettier --write \
            src/renderer/app/AppShell.tsx \
            src/renderer/app/app-shell.css \
            src/renderer/state/project-session/use-project-session.ts \
            tests/component/AppShell.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/renderer/app/AppShell.tsx \
            src/renderer/app/app-shell.css \
            src/renderer/state/project-session/use-project-session.ts \
            tests/component/AppShell.test.tsx
          git commit -m "style: format T11-W02-05 files"
          git push origin HEAD:sol/t11-w02-05-frozen-media-ui
