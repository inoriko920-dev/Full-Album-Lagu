name: TEMP W05-07 Script Formatter
on:
  push:
    branches: [sol/t11-w05-07-wave-closure-20261008]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write scripts/run-w11-visual-template-closure.mjs
      - name: Commit formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-w11-visual-template-closure.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format W11-05 Electron E2E harness"
            git push
          fi
